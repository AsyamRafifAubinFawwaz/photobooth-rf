<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hias & Download — Nashallery's Booth</title>
  <meta name="description" content="Tambahkan stiker lucu ke foto photobooth kamu lalu download!" />

  <!-- Favicon -->
  <link rel="icon" href="Assets/fish-photobooth/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="StyleSheets/final.css?v=3" />
</head>
<body>
  <div class="logo" id="logoBtn">
    <img src="Assets/fish-photobooth/logo-new.png" alt="Logo" />
  </div>

  <!-- Page Header -->
  <div class="page-header">
    <h1>Add Stickers!</h1>
    <p>(drag to reposition)</p>
  </div>

  <!-- Sticker Panel -->
  <div class="sticker-panel">
    <div class="sticker-scroll" id="stickerScroll">
      <!-- Sticker items injected by JS -->
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvasContainer">
    <canvas id="finalCanvas"></canvas>
  </div>

  <!-- Action Buttons -->
  <div class="button-container">
    <button id="downloadBtn">Download</button>
    <button id="resetBtn">Reset</button>
    <button id="homeBtn">Home</button>
  </div>

  <script src="Javascripts/frameConfig.js"></script>
  <script src="Javascripts/final.js"></script>
</body>
</html>
