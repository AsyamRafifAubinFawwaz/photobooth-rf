<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motrack — Your Photo Moment</title>
  <meta name="description" content="Abadikan momen dengan Motrack. Pilih frame, ambil atau upload foto, lalu hias dan download hasilnya." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='14' fill='%23176b63'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='25' fill='white'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="StyleSheets/motrack-home.css?v=1" />
</head>
<body>
  <a class="logo" href="index.html" aria-label="Motrack beranda">
    <span class="logo-mark" aria-hidden="true">M</span>
    <span class="logo-name">motrack</span>
  </a>

  <div class="home-container">
    <section class="hero-copy">
      <span class="eyebrow">Momenmu, gayamu</span>
      <h1>Make it a <span>moment.</span></h1>
      <p>Pilih frame favorit, abadikan momen, dan bawa pulang hasil foto yang paling kamu suka.</p>
      <div class="button-container">
        <button id="select-button">Mulai photobooth</button>
      </div>
      <p class="hero-note">Ambil foto langsung atau upload dari galeri.</p>
    </section>

    <div class="photobooth-container" aria-label="Preview frame Motrack">
      <div class="frame-preview-card">
        <img src="Assets/fish-photobooth/camerapage/frame2.png" alt="Preview frame foto Motrack dengan dua slot foto" />
      </div>
      <span class="frame-preview-caption">Frame pilihanmu</span>
    </div>
  </div>

  <script src="Javascripts/motrack-home.js?v=1"></script>
</body>
</html>
